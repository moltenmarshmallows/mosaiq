global:
  scrape_interval: 15s

scrape_configs:
  # Supervisor: pipeline jobs, queue depth, worker registry, TTP, process stats.
  # /metrics is protected by VMP_SUPERVISOR_DASHBOARD_SECRET — mount the secret
  # into Prometheus (PROMETHEUS_BEARER_TOKEN_FILE) or pass --web.config for basic auth.
  - job_name: vmp-supervisor
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/dashboard_token
    static_configs:
      - targets: ["vmp-supervisor:8788"]

  # Redis: queue lengths, memory, client counts.
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
