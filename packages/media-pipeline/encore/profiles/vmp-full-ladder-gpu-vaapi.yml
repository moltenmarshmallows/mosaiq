name: vmp-full-ladder-gpu-vaapi
description: VMP full ladder via VAAPI (worker GPU required)
scaling: bicubic
encodes:
  - type: VideoEncode
    codec: h264_vaapi
    format: mp4
    suffix: _1080p
    height: 1080
    twoPass: false
    filters: ["format=nv12,hwupload"]
    params:
      b:v: 5000k
      maxrate: 5000k
      bufsize: 10000k
      r: 30
      g: 60
      keyint_min: 60
      sc_threshold: 0
      profile:v: high

  - type: VideoEncode
    codec: h264_vaapi
    format: mp4
    suffix: _720p
    height: 720
    twoPass: false
    filters: ["format=nv12,hwupload"]
    params:
      b:v: 3000k
      maxrate: 3000k
      bufsize: 6000k
      r: 30
      g: 60
      keyint_min: 60
      sc_threshold: 0
      profile:v: high
    audioEncode:
      type: AudioEncode
      bitrate: 128k

  - type: VideoEncode
    codec: h264_vaapi
    format: mp4
    suffix: _480p
    height: 480
    twoPass: false
    filters: ["format=nv12,hwupload"]
    params:
      b:v: 1500k
      maxrate: 1500k
      bufsize: 3000k
      r: 30
      g: 60
      keyint_min: 60
      sc_threshold: 0
      profile:v: main
