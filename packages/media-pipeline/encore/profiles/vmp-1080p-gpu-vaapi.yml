name: vmp-1080p-gpu-vaapi
description: VMP phase-2 — 1080p H.264 via VAAPI (worker GPU required)
scaling: bicubic
encodes:
  - type: VideoEncode
    codec: h264_vaapi
    format: mp4
    suffix: _1080p
    height: 1080
    twoPass: false
    filters: ["format=nv12,hwupload"]
    params:
      b:v: 5000k
      maxrate: 5000k
      bufsize: 10000k
      r: 30
      g: 60
      keyint_min: 60
      sc_threshold: 0
      profile:v: high
