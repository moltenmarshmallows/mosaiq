name: vmp-720p-audio-gpu-nvenc
description: VMP fast-lane 720p via NVENC (Encore worker needs NVIDIA + h264_nvenc FFmpeg)
scaling: bicubic
encodes:
  - type: VideoEncode
    codec: h264_nvenc
    format: mp4
    suffix: _720p
    height: 720
    twoPass: false
    params:
      b:v: 3000k
      maxrate: 3000k
      bufsize: 6000k
      r: 30
      fps_mode: cfr
      pix_fmt: yuv420p
      g: 60
      keyint_min: 60
      sc_threshold: 0
      preset: p4
    audioEncode:
      type: AudioEncode
      bitrate: 128k
