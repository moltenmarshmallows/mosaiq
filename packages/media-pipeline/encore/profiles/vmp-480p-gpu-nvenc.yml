name: vmp-480p-gpu-nvenc
description: VMP phase-2 — 480p H.264 via NVENC (worker GPU required)
scaling: bicubic
encodes:
  - type: VideoEncode
    codec: h264_nvenc
    format: mp4
    suffix: _480p
    height: 480
    twoPass: false
    params:
      b:v: 1500k
      maxrate: 1500k
      bufsize: 3000k
      r: 30
      fps_mode: cfr
      pix_fmt: yuv420p
      g: 60
      keyint_min: 60
      sc_threshold: 0
      profile:v: main
      preset: p4
